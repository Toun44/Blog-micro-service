name: CI/CD Blog Microservices

on:
  push:
    branches: [ main ]        # déclenche tous les jobs

env:
  REGISTRY: localhost:5000
  IMAGE_PREFIX: blog-microservices

jobs:

  # ────────────────────────a─────────────────
  # BUILD & TEST
  # ─────────────────────────────────────────
  build:
    name: Build & Test ${{ matrix.service }}
    runs-on: self-hosted

    strategy:
      matrix:
        service:
          - eureka-server
          - api-gateway
          - article-service
          - comment-service
          - category-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build ${{ matrix.service }}
        run: mvn -pl ${{ matrix.service }} -am package -DskipTests

      - name: Test ${{ matrix.service }}
        run: mvn -pl ${{ matrix.service }} test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────
  # DOCKER BUILD & PUSH
  # ─────────────────────────────────────────
  docker:
    name: Docker ${{ matrix.service }}
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        include:
          - service: eureka-server
            context: .
            file: eureka-server/Dockerfile
          - service: api-gateway
            context: .
            file: api-gateway/Dockerfile
          - service: article-service
            context: .
            file: article-service/Dockerfile
          - service: comment-service
            context: .
            file: comment-service/Dockerfile
          - service: category-service
            context: .
            file: category-service/Dockerfile
          - service: frontend
            context: ./frontend
            file: ./frontend/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # DEPLOY
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: self-hosted
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          docker compose pull
          docker compose up -d --no-build
          docker image prune -f
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
